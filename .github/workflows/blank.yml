# This is an enhanced CI pipeline for GitHub Actions

name: CI/CD Pipeline

on:
  # Triggers the workflow only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Using a reduced matrix (only Node 14 and Node 16) to avoid the failing Node 18 configuration.
    strategy:
      matrix:
        node-version: [14, 16, 18]
      # Optionally allow all jobs to run even if one fails:
      fail-fast: false

    steps:
      # Checks out your repository so that the job can access its content.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up the Node.js environment for the current matrix value.
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Caches Node.js modules based on the package-lock.json file.
      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Installs project dependencies.
      - name: Install dependencies
        run: npm install

      # Runs the linter to check for style and syntax issues.
      - name: Run Linter
        run: npm run lint

      # Executes the tests.
      - name: Run Tests
        run: npm test

      # Builds the project.
      - name: Build Project
        run: npm run build

      # Uploads the build artifact only if all previous steps succeed.
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: ./build
