name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
      - name: Copy Static Files
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Directory 'dist' does not exist. Please update the path to your static site files."
            exit 1
          fi
          mkdir -p _site
          cp -r ./dist/* ./_site/  # Replace "dist" with your actual output directory
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
